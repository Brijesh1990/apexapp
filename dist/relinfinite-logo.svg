    <path d="M 10 10 L 105 10 C 135 10 155 28 155 58 C 155 86 136 104 108 106 L 155 150 L 118 150 L 78 110 L 38 110 L 38 150 L 10 150 Z M 38 38 L 38 82 L 100 82 C 116 82 126 73 126 60 C 126 47 116 38 100 38 Z" />
  </g>

  <!-- Brand Name: RELINFINITE -->
  <text x="180" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="1" fill="#17449E">RELINFINITE</text>

  <!-- Tagline: An Industrial and Infrastructure Construction Company -->
  <text x="183" y="130" font-family="'Impact', 'Arial Black', 'Trebuchet MS', system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="0.2" fill="#292D32">An Industrial and Infrastructure Construction Company</text>
</svg>
